<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메일 판단 라벨 검수</title>
<style>
  :root{
    --ink:#1b1c1e; --ink2:#55585e; --ink3:#868b93;
    --bg:#f6f5f2; --card:#fff; --line:#e2e0da; --accent:#3b5bdb; --accent-soft:#eef1fd;
    --yes:#2f7a52; --no:#9a3f3f; --hold:#7a6a3f;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ink:#e9e8e4; --ink2:#a8adb5; --ink3:#7b8089;
    --bg:#16171a; --card:#1e2024; --line:#2e3138; --accent:#8da2fb; --accent-soft:#232941;
    --yes:#6fcf97; --no:#e79a9a; --hold:#d9c48a;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  .bar{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;
        margin-bottom:14px}
  .card.done{opacity:.55}
  .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--ink3);font-size:12.5px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px}
  .tag.replied{border-color:var(--yes);color:var(--yes)}
  h2{font-size:16px;margin:6px 0 2px;font-weight:620;letter-spacing:-.01em;text-wrap:balance}
  .body{white-space:pre-wrap;word-break:break-word;font-size:13.5px;color:var(--ink2);
        max-height:190px;overflow:auto;background:var(--bg);border:1px solid var(--line);
        border-radius:7px;padding:10px;margin:10px 0}
  .body.open{max-height:none}
  .more{font-size:12px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
  .why{font-size:12.5px;color:var(--ink3);margin:0 0 10px}
  .q{display:grid;grid-template-columns:200px 1fr;gap:8px;align-items:center;
     padding:7px 0;border-top:1px solid var(--line)}
  .q > span{font-size:13.5px;color:var(--ink2)}
  .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opts button{font:inherit;font-size:13px;padding:4px 12px;border-radius:7px;cursor:pointer;
          border:1px solid var(--line);background:var(--card);color:var(--ink2)}
  .opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
          color:var(--accent);font-weight:600}
  .opts button.draft::after{content:" ·";color:var(--ink3)}
  .status{font-size:12px;color:var(--ink3);margin-top:8px;min-height:1em}
  @media (max-width:560px){ .q{grid-template-columns:1fr;gap:4px} }
</style>
</head>
<body>
<header>
  <h1>메일 판단 라벨 검수</h1>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div class="count" id="count">…</div>
</header>
<main id="list"></main>

<script>
const QS = [
  ["needs_reply",      "답장을 내가 써야 하나",        [[true,"예"],[false,"아니오"],[null,"보류"]]],
  ["action_elsewhere", "답장 말고 폼·링크에서 처리하나", [[true,"예"],[false,"아니오"],[null,"보류"]]],
  ["needs_human",      "사람이 직접 써야 하나",         [[true,"예"],[false,"아니오"],[null,"해당없음/보류"]]],
  ["urgency",          "긴급도 (받은 시점 기준)",       [[0,"0 기한없음"],[1,"1 이번주"],[2,"2 오늘·내일"],[3,"3 지금"]]],
];
const state = new Map();

function render(items){
  const list = document.getElementById("list");
  list.textContent = "";
  for (const it of items){
    const gold = it.saved || {...it.draft};
    state.set(it.key, {item: it, gold, saved: !!it.saved});
    const card = document.createElement("section");
    card.className = "card" + (it.saved ? " done" : "");
    card.id = "c" + it.n;

    const meta = document.createElement("div");
    meta.className = "meta";
    const last = it.messages[it.messages.length - 1];
    meta.append(chip("#" + it.n), chip(it.account), chip(last.sender || "(이름 없음)"),
                chip((last.at || "").slice(0, 16).replace("T", " ")));
    if (it.replied_later){ const t = chip("실제로 답장함"); t.classList.add("replied"); meta.append(t); }
    card.append(meta);

    const h = document.createElement("h2");
    h.textContent = it.subject || "(제목 없음)";
    card.append(h);

    const body = document.createElement("div");
    body.className = "body";
    body.textContent = it.messages.map(m =>
      (m.side === "us" ? "[내가 보냄] " : "") + m.text).join("\n\n———\n\n");
    card.append(body);
    const more = document.createElement("button");
    more.className = "more"; more.type = "button"; more.textContent = "전체 보기";
    more.onclick = () => { body.classList.toggle("open");
      more.textContent = body.classList.contains("open") ? "접기" : "전체 보기"; };
    card.append(more);

    const why = document.createElement("p");
    why.className = "why"; why.textContent = "초안 근거: " + it.why;
    card.append(why);

    for (const [key, label, opts] of QS){
      const row = document.createElement("div");
      row.className = "q";
      const name = document.createElement("span"); name.textContent = label;
      const box = document.createElement("div"); box.className = "opts";
      for (const [val, text] of opts){
        const b = document.createElement("button");
        b.type = "button"; b.textContent = text;
        if (it.draft[key] === val) b.classList.add("draft");
        b.setAttribute("aria-pressed", String(gold[key] === val));
        b.onclick = () => {
          gold[key] = val;
          [...box.children].forEach(c => c.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          save(it.key, card);
        };
        box.append(b);
      }
      row.append(name, box);
      card.append(row);
    }
    const status = document.createElement("div");
    status.className = "status";
    status.textContent = it.saved ? "검수됨" : "초안 그대로 — 확인하면 버튼을 눌러 주세요";
    card.append(status);
    list.append(card);
  }
  progress();
}

function chip(text){ const s = document.createElement("span"); s.className = "tag"; s.textContent = text; return s; }

async function save(key, card){
  const entry = state.get(key);
  const status = card.querySelector(".status");
  try{
    const res = await fetch("/save", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({key, gold: entry.gold})});
    if (!res.ok) throw new Error(res.status);
    entry.saved = true;
    card.classList.add("done");
    status.textContent = "저장됨 · " + new Date().toLocaleTimeString("ko-KR");
    progress();
  }catch(e){
    status.textContent = "저장 실패: " + e.message + " — 서버가 떠 있는지 확인해 주세요";
  }
}

function progress(){
  const total = state.size;
  const done = [...state.values()].filter(v => v.saved).length;
  document.getElementById("bar").style.width = (total ? done / total * 100 : 0) + "%";
  document.getElementById("count").textContent = done + " / " + total + " 검수";
}

fetch("/items").then(r => r.json()).then(render).catch(e => {
  document.getElementById("list").textContent = "표본을 불러오지 못했습니다: " + e.message;
});
</script>
</body>
</html>
